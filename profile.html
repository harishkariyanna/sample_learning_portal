<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="profile.css">
</head>
<body>
    <aside>
        <h2>Company Logo</h2>
        <nav>
            <a href="dashboard.html"><i class="fas fa-tachometer-alt"></i>Dashboard</a>
            <a href="my_courses.html"><i class="fas fa-book"></i>My Courses</a>
            <a href="quizzes.html"><i class="fas fa-question-circle"></i>Quizzes</a>
            <a href="notes.html"><i class="fas fa-sticky-note"></i>My Notes</a>
            <a href="certifications.html"><i class="fas fa-certificate"></i>My Certifications</a>
            <a href="learning_history.html"><i class="fas fa-history"></i>Learning History</a>
            <a href="profile.html" class="active"><i class="fas fa-user"></i>Profile</a>
        </nav>
    </aside>
    <main>
        <h1><i class="fas fa-user me-2"></i>My Profile</h1>
        <div class="row">
            <div class="col-md-4">
                <div class="content-card text-center">
                    <div class="avatar-container mb-3">
                        <i class="fas fa-user-circle avatar-icon"></i>
                    </div>
                    <h5>Jane Smith</h5>
                    <p class="text-muted">Learning Experience Designer</p>
                    <button class="btn btn-outline-primary btn-sm"><i class="fas fa-camera me-2"></i>Change Photo</button>
                </div>
            </div>
            <div class="col-md-8">
                <div class="content-card">
                    <h5 class="mb-4"><i class="fas fa-info-circle me-2"></i>Profile Information</h5>
                    <div class="row mb-3">
                        <div class="col-sm-4"><strong>Name:</strong></div>
                        <div class="col-sm-8">Jane Smith</div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-4"><strong>Role:</strong></div>
                        <div class="col-sm-8">Learning Experience Designer</div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-4"><strong>Department:</strong></div>
                        <div class="col-sm-8">Human Resources</div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-4"><strong>Notifications:</strong></div>
                        <div class="col-sm-8">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="notifications" checked>
                                <label class="form-check-label" for="notifications">Enabled</label>
                            </div>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-4"><strong>Language:</strong></div>
                        <div class="col-sm-8">
                            <select class="form-select form-select-sm" style="width: auto;">
                                <option selected>English</option>
                                <option>Spanish</option>
                                <option>French</option>
                            </select>
                        </div>
                    </div>
                    <div class="row mb-4">
                        <div class="col-sm-4"><strong>Theme:</strong></div>
                        <div class="col-sm-8">
                            <select class="form-select form-select-sm" style="width: auto;">
                                <option selected>Light</option>
                                <option>Dark</option>
                            </select>
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-primary"><i class="fas fa-save me-2"></i>Save Changes</button>
                        <button class="btn btn-outline-secondary"><i class="fas fa-key me-2"></i>Change Password</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
