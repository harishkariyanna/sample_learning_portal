<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <div class="card">
        <div class="card-body">
          <h2 class="card-title text-center mb-4">Forgot Password</h2>
          <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label class="form-label">Email:</label>
              <input type="email" class="form-control" formControlName="email" placeholder="Enter your email" required>
            </div>
            <div class="alert" [class.alert-success]="isSuccess" [class.alert-danger]="!isSuccess" *ngIf="message">{{message}}</div>
            <button type="submit" class="btn btn-primary w-100" [disabled]="!forgotPasswordForm.valid">Send Reset Token</button>
            <p class="text-center mt-3"><a routerLink="/login" class="text-decoration-none">Back to Login</a></p>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
