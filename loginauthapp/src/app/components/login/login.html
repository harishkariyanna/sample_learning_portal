<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <div class="card">
        <div class="card-body">
          <h2 class="card-title text-center mb-4">Login</h2>
          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label class="form-label">Email:</label>
              <input type="email" class="form-control" formControlName="email" placeholder="Enter your email" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Password:</label>
              <input type="password" class="form-control" formControlName="password" required>
            </div>
            <div class="alert alert-danger" *ngIf="errorMessage">{{errorMessage}}</div>
            <button type="submit" class="btn btn-primary w-100" [disabled]="!loginForm.valid || isLoading">
              <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
              {{isLoading ? 'Logging in...' : 'Login'}}
            </button>
            <p class="text-center mt-2"><a routerLink="/forgot-password" class="text-decoration-none">Forgot Password?</a></p>
            <p class="text-center mt-1"><a routerLink="/register" class="text-decoration-none">Don't have an account? Register</a></p>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
