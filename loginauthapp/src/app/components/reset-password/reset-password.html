<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <div class="card">
        <div class="card-body">
          <h2 class="card-title text-center mb-4">Reset Password</h2>
          <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label class="form-label">Email:</label>
              <input type="email" class="form-control" formControlName="email" readonly>
            </div>
            <div class="mb-3">
              <label class="form-label">OTP Code:</label>
              <input type="text" class="form-control" formControlName="otpCode" placeholder="Enter 6-digit OTP" maxlength="6">
            </div>
            <div class="mb-3">
              <label class="form-label">New Password:</label>
              <input type="password" class="form-control" formControlName="newPassword" placeholder="Enter new password">
            </div>
            <div class="alert alert-danger" *ngIf="errorMessage">{{errorMessage}}</div>
            <div class="alert alert-success" *ngIf="successMessage">{{successMessage}}</div>
            <button type="submit" class="btn btn-primary w-100" [disabled]="!resetForm.valid || isLoading">
              <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
              {{isLoading ? 'Resetting...' : 'Reset Password'}}
            </button>
            <p class="text-center mt-3"><a routerLink="/login" class="text-decoration-none">Back to Login</a></p>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
